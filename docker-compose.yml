version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: library-db
    environment:
      MYSQL_DATABASE: library_management
      MYSQL_ROOT_PASSWORD: Ni3@MySQL
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build: ./Backend-springboot
    container_name: library-backend
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=library_management
      - DB_USERNAME=root
      - DB_PASSWORD=Ni3@MySQL
      # Add mail, oauth client id, razorpay keys here as environment variables if needed
    depends_on:
      - db

  frontend:
    build: ./Frontend-Vite
    container_name: library-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
